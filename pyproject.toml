[tool.poetry]
name = "ble-led-badge"
version = "0.1.0"
description = "A Python project for controlling BLE LED badges."
authors = ["Tim Hodson <tim@timhodson.com>"]
license = "MIT"
packages = [{include = "badge_controller"}, {include = "osc_server"}]

[tool.poetry.dependencies]
python = "^3.10"
bleak = "^3.0.2"
pycryptodome = ">=3.19.0,<5"
python-osc = "^1.10.2"

[tool.poetry.scripts]
badge-controller = "badge_controller.cli:main"
badge-osc-server = "osc_server.server:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"